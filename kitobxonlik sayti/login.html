<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tizimga kirish - Kitobxon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="text-center mb-3">
        <a href="index.html" style="font-size: 1.5rem; font-weight: 800; color: var(--primary);">
          📚 Kitobxon
        </a>
      </div>
      <h2>Tizimga kirish</h2>
      <p class="auth-subtitle">Hisobingizga kiring va kitoblarni baholang</p>

      <div id="msg" class="alert" style="display: none;"></div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          <input type="email" class="form-control" id="loginEmail" placeholder="email@misol.uz" autocomplete="email">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Parol</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" class="form-control" id="loginPassword" placeholder="Parolni kiriting" autocomplete="current-password">
        </div>
      </div>
      <button type="button" class="btn btn-primary mt-2 w-100" onclick="doLogin()">
        <i class="fas fa-sign-in-alt me-2"></i> Kirish
      </button>
      <p class="auth-link mt-3">Hisobingiz yo'qmi? <a href="register.html">Ro'yxatdan o'ting</a></p>

      <hr>
      <div class="text-center">
        <small class="text-muted">Demo: <strong>dasilbek461@gmail.com</strong> / <strong>admin123</strong></small>
      </div>
      <p class="text-center mt-2"><a href="index.html" style="color: #999; font-size: 0.85rem;">← Bosh sahifaga qaytish</a></p>
    </div>
  </div>

  <script>
    var DEFAULT_USERS = [
      { id: 1, fullname: "Asilbek", username: "asilbek", email: "dasilbek461@gmail.com", password: "admin123", role: "admin", avatar: null },
      { id: 2, fullname: "Aziz Karimov", username: "aziz", email: "aziz@gmail.com", password: "123456", role: "user", avatar: null },
      { id: 3, fullname: "Sardor Rakhimov", username: "sardor", email: "sardor@gmail.com", password: "123456", role: "user", avatar: null }
    ];

    function showMsg(text, type) {
      var el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'alert alert-' + type;
      el.style.display = 'block';
    }

    function doLogin() {
      var email = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;

      if (!email) { showMsg('Emailni kiriting!', 'danger'); return; }
      if (!password) { showMsg('Parolni kiriting!', 'danger'); return; }

      var raw = localStorage.getItem('kitobxonApp');
      var state;

      try {
        state = raw ? JSON.parse(raw) : null;
      } catch (e) {
        state = null;
      }

      var users;
      if (state && state.users && Array.isArray(state.users) && state.users.length > 0) {
        users = state.users;
      } else {
        users = DEFAULT_USERS;
      }

      var user = null;
      for (var i = 0; i < users.length; i++) {
        if (users[i].email === email && users[i].password === password) {
          user = users[i];
          break;
        }
      }

      if (user) {
        try {
          localStorage.setItem('kitobxonUser', JSON.stringify(user));
        } catch (e) {
          showMsg('Saqlashda xatolik!', 'danger');
          return;
        }
        showMsg('Muvaffaqiyatli kirdingiz! Yo\'naltirilmoqda...', 'success');
        setTimeout(function() { window.location.href = 'index.html'; }, 500);
      } else {
        var emailFound = false;
        for (var i = 0; i < users.length; i++) {
          if (users[i].email === email) { emailFound = true; break; }
        }
        if (emailFound) {
          showMsg('Parol noto\'g\'ri!', 'danger');
        } else {
          showMsg('Bu email topilmadi! Avval ro\'yxatdan o\'ting.', 'danger');
        }
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
