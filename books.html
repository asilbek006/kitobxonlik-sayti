  <section class="section">
    <div class="container">
      <h2 class="section-title mb-4" data-t="books_title">Barcha <span>kitoblar</span></h2>

      <div class="search-section mb-4">
        <div class="row g-3">
          <div class="col-lg-5 col-md-6">
            <div class="input-group">
              <span class="input-group-text" style="border-radius: 10px 0 0 10px; background: white;"><i class="fas fa-search"></i></span>
              <input type="text" class="form-control" id="searchInput" data-t-placeholder="search_placeholder_books" placeholder="Kitob nomi, muallif yoki janr...">
            </div>
          </div>
          <div class="col-lg-3 col-md-6">
            <select class="form-select" id="filterCategory">
              <option value="" data-t="all_categories_opt">Barcha kategoriyalar</option>
            </select>
          </div>
          <div class="col-lg-2 col-md-6">
            <select class="form-select" id="sortBy">
              <option value="newest" data-t="sort_newest">Eng yangi</option>
              <option value="rating" data-t="sort_rating">Eng yuqori reyting</option>
              <option value="reviews" data-t="sort_reviews">Eng ko'p sharh</option>
              <option value="az" data-t="sort_az">Alifbo bo'yicha</option>
            </select>
          </div>
          <div class="col-lg-2 col-md-6">
            <button class="btn btn-search w-100" onclick="performSearch()"><i class="fas fa-search me-2"></i> <span data-t="search_btn">Qidirish</span></button>
          </div>
        </div>
      </div>

      <div class="row" id="booksContainer"></div>

      <div class="empty-state" id="emptyState" style="display: none;">
        <i class="fas fa-book-open"></i>
        <h4 data-t="no_books">Kitob topilmadi</h4>
        <p data-t="no_books_hint">Qidiruv so'zlaringizni o'zgartirib ko'ring</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2024 Kitobxon. <span data-t="footer_right">Barcha huquqlar himoyalangan.</span></p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    try { initApp(); } catch(e) { console.error('initApp:', e); }
    applyTranslations();

    const filterCat = document.getElementById('filterCategory');

    function renderCategoryFilter() {
      const selected = filterCat.value;
      filterCat.innerHTML = `<option value="" data-t="all_categories_opt">${t('all_categories_opt')}</option>`;
      CATEGORIES.forEach(c => { filterCat.innerHTML += `<option value="${c.id}">${t('cat_' + c.id)}</option>`; });
      if (selected) filterCat.value = selected;
    }

    renderCategoryFilter();

    const urlCat = getUrlParam('category');
    if (urlCat) { filterCat.value = urlCat; performSearch(); }
    const urlQ = getUrlParam('q');
    if (urlQ) document.getElementById('searchInput').value = urlQ;

    function performSearch() {
      const books = searchBooks(
        document.getElementById('searchInput').value,
        document.getElementById('filterCategory').value,
        document.getElementById('sortBy').value
      );
      const container = document.getElementById('booksContainer');
      const empty = document.getElementById('emptyState');
      if (books.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        container.innerHTML = books.map(b => renderBookCard(b)).join('');
      }
    }

    document.getElementById('searchInput').addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
    document.getElementById('filterCategory').addEventListener('change', performSearch);
    document.getElementById('sortBy').addEventListener('change', performSearch);
    performSearch();
  </script>
</body>
</html>
