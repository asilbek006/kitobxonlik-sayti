  <link href="css/style.css?v=9" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">📚 Kitobxon</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <i class="fas fa-bars" style="color: white;"></i>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html" data-t="nav_home"><i class="fas fa-home"></i> Bosh sahifa</a></li>
          <li class="nav-item"><a class="nav-link" href="books.html" data-t="nav_books">📚 Kitoblar</a></li>
          <li class="nav-item"><a class="nav-link active" href="categories.html" data-t="nav_categories">🗂 Kategoriyalar</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item"><div class="lang-switcher"><button class="lang-btn active" data-lang="uz" onclick="switchLang('uz')">🇺🇿 UZ</button><button class="lang-btn" data-lang="ru" onclick="switchLang('ru')">🇷🇺 RU</button><button class="lang-btn" data-lang="en" onclick="switchLang('en')">🇬🇧 EN</button></div></li>
          <li class="nav-item"><button class="nav-link" onclick="toggleDarkMode()" id="darkModeBtn">🌙 Dark</button></li>
          <li class="nav-item"><button class="nav-link" onclick="resetData()">🔄 Yangilash</button></li>
          <li class="nav-item" id="authNav" style="display: flex; gap: 8px;">
            <a class="btn btn-login" href="login.html"><i class="fas fa-sign-in-alt"></i> <span data-t="nav_login">Kirish</span></a>
            <a class="btn btn-login" href="register.html"><i class="fas fa-user-plus"></i> <span data-t="nav_register">Ro'yxatdan o'tish</span></a>
          </li>
          <li class="nav-item user-menu" id="userNav" style="display: none;">
            <a class="nav-link" href="add-book.html" id="addBookLink"><i class="fas fa-plus-circle"></i> <span data-t="nav_add_book">Kitob qo'shish</span></a>
            <a class="nav-link" href="admin.html" id="adminLink" style="display:none;"><i class="fas fa-cog"></i> <span data-t="nav_admin">Admin</span></a>
            <div class="dropdown">
              <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown"><div class="user-avatar" id="userAvatarNav">A</div></a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><span class="dropdown-item-text fw-bold" id="userDisplayName">User</span></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="profile.html"><i class="fas fa-user me-2"></i> <span data-t="nav_profile">Profil</span></a></li>
                <li><a class="dropdown-item text-danger" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i> <span data-t="nav_logout">Chiqish</span></a></li>
              </ul>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <h2 class="section-title text-center mb-4" data-t="categories_title">Kategoriyalar <span>bo'yicha</span></h2>
      <p class="section-subtitle text-center mb-5" data-t="categories_subtitle">Qiziqishingizga mos kitoblarni toping</p>
      <div class="row" id="categoriesContainer"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2024 Kitobxon. <span data-t="footer_right">Barcha huquqlar himoyalangan.</span></p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
  <script>
    try { initApp(); } catch(e) { console.error('initApp error:', e); }
    try { applyTranslations(); } catch(e) {}

    function renderCategories() {
      var el = document.getElementById('categoriesContainer');
      if (!el) return;
      el.innerHTML = CATEGORIES.map(function(c) {
        var count = appState.books.filter(function(b) { return b.category_id === c.id && b.status === 'approved'; }).length;
        var catName = t('cat_' + c.id);
        return '<div class="col-lg-3 col-md-4 col-6 mb-4">' +
          '<a href="books.html?category=' + c.id + '">' +
          '<div class="category-card" style="text-align:center; padding: 30px 15px;">' +
          '<div class="cat-icon" style="background: linear-gradient(135deg, ' + c.color + ', ' + c.color + 'dd); width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 1.5rem; color: white;">' +
          '<i class="fas ' + c.icon + '"></i>' +
          '</div>' +
          '<h5>' + catName + '</h5>' +
          '<p class="text-muted">' + count + ' ' + t('books_count') + '</p>' +
          '</div>' +
          '</a>' +
          '</div>';
      }).join('');
    }

    renderCategories();
  </script>
</body>
</html>
